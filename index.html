<style>
:root{
  --bg:#f4f1ea;--card:#ffffff;--text:#0b1730;--muted:#5b6578;
  --border:#d9d4c6;--accent:#0b1730;--gold:#b08d3c;--btn-text:#ffffff;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0a1226;--card:#121c36;--text:#f3efe3;--muted:#9aa5bd;
    --border:#243252;--accent:#1b2a50;--gold:#d4b266;--btn-text:#f3efe3;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex;justify-content:center;padding:40px 16px 24px;
}
main{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center}
.avatar{
  width:96px;height:96px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--accent);color:var(--gold);
  font-size:34px;font-weight:600;letter-spacing:1px;
  border:2px solid var(--gold);
}
h1{margin:18px 0 6px;font-size:1.6rem;font-weight:650;text-align:center}
.sub{margin:0 0 6px;color:var(--muted);font-size:.98rem;text-align:center}
.rule{width:40px;height:2px;background:var(--gold);border:0;margin:14px 0 26px}
nav{width:100%;display:flex;flex-direction:column;gap:12px}
.btn{
  display:flex;align-items:center;gap:14px;width:100%;min-height:58px;
  padding:14px 18px;border-radius:14px;text-decoration:none;
  background:var(--card);color:var(--text);border:1px solid var(--border);
  font-size:1.05rem;font-weight:550;
  transition:transform .12s ease,border-color .12s ease,background .12s ease;
}
.btn:hover,.btn:focus-visible{border-color:var(--gold);transform:translateY(-1px)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn:active{transform:scale(.99)}
.btn.primary{background:var(--accent);color:var(--btn-text);border-color:var(--accent)}
.btn svg{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn svg.fill{fill:currentColor;stroke:none}
.btn.primary svg{stroke:var(--gold)}
footer{margin-top:34px;font-size:.72rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
